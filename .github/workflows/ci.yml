name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned to a full commit SHA
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, pinned to a full commit SHA
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:web
      - run: npm run build
      - name: Offline tests (unit + API-shape hallucination check)
        run: npm run test:offline
      - name: Layout gate (no wrapped header text, no spilled or overlapping cards)
        run: |
          npx playwright install --with-deps chromium
          npm run test:layout
      - name: Hygiene gate (fallow, new dead code only)
        run: npm run hygiene
        continue-on-error: true
