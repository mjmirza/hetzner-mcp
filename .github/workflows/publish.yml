name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-npm:
    # Public npmjs release. Runs only on a real release, never on manual dispatch,
    # so it can never try to republish an existing version.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned to full commit SHA
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, pinned to full commit SHA
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Release tag must match package.json version
        run: node scripts/check-release-tag.mjs
        env:
          TAG: ${{ github.event.release.tag_name }}
      - run: npm run build
      - run: npm run test:offline
      - run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github:
    # GitHub Packages mirror, scoped to the owner as GitHub requires. Runs on a release
    # and on manual dispatch, so an existing version can be mirrored at any time.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned to full commit SHA
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, pinned to full commit SHA
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@mjmirza"
      - run: npm ci
      - run: npm run build
      # GitHub Packages needs an owner-scoped name, so mirror under @mjmirza in the
      # runner only. The public npmjs name (hetzner-mcp) is never changed on disk.
      - run: npm pkg set name=@mjmirza/hetzner-mcp
      - run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
